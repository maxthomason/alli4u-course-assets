<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alli 4U Folder Navigation - People & Culture Layout</title>
  <style>
    :root {
      --sidebar-bg: #ffffff;
      --header-bg: #f3f3f3;
      --border-color: #e8e8e8;
      --text-main: #333333;
      --text-muted: #616161;
      --text-bright: #000000;
      --hover-bg: #f0f0f0;
      --active-bg: #e4e6f1;
      --active-text: #000000;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--sidebar-bg);
      font-family: var(--font-ui);
      color: var(--text-main);
      font-size: 13px;
      overflow: hidden;
      padding: 0;
    }

    .explorer-container {
      width: 100%;
      height: 100vh;
      background-color: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .sidebar-header {
      height: 38px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--header-bg);
    }

    .sidebar-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-bright);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tree-view {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-top: 4px;
      padding-bottom: 12px;
    }

    .tree-view::-webkit-scrollbar {
      width: 8px;
    }

    .tree-view::-webkit-scrollbar-thumb {
      background: #cccccc;
      border-radius: 4px;
    }

    .tree-item {
      display: flex;
      align-items: center;
      height: 24px;
      padding-right: 8px;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      color: var(--text-main);
      font-size: 13px;
    }

    .tree-item:hover {
      background-color: var(--hover-bg);
    }

    .tree-item.selected {
      background-color: var(--active-bg);
      color: var(--active-text);
      font-weight: 500;
    }

    .chevron {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 2px;
      flex-shrink: 0;
      color: var(--text-muted);
      transition: transform 0.1s ease;
    }

    .chevron svg {
      width: 9px;
      height: 9px;
      fill: currentColor;
    }

    .chevron.expanded {
      transform: rotate(90deg);
    }

    .item-icon {
      width: 16px;
      height: 16px;
      margin-right: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .item-icon svg {
      width: 15px;
      height: 15px;
    }

    .item-label {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .custom-tooltip {
      position: absolute;
      background: #ffffff;
      border: 1px solid #cccccc;
      color: #222222;
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 11px;
      pointer-events: none;
      z-index: 100;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      white-space: nowrap;
      display: none;
    }
  </style>
</head>
<body>

  <div class="explorer-container">
    <div class="sidebar-header">
      <span class="sidebar-title">ALLI4U - PEOPLE & CULTURE</span>
    </div>
    <div class="tree-view" id="treeContainer"></div>
  </div>

  <div class="custom-tooltip" id="tooltip"></div>

  <script>
    const ICONS = {
      folder: `<svg viewBox="0 0 16 16" fill="#c09553"><path d="M7.5 3L6 1.5H1.5A1.5 1.5 0 0 0 0 3v10A1.5 1.5 0 0 0 1.5 14.5h13a1.5 1.5 0 0 0 1.5-1.5V4.5A1.5 1.5 0 0 0 14.5 3H7.5z"/></svg>`,
      folderOpen: `<svg viewBox="0 0 16 16" fill="#dcb67a"><path d="M1.5 3A1.5 1.5 0 0 0 0 4.5v8A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-6A1.5 1.5 0 0 0 14.5 5H7.5L6 3.5H1.5z"/></svg>`,
      markdown: `<svg viewBox="0 0 16 16" fill="#005fb8"><path d="M14.5 2h-13A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2zM3 11.5V4.5h1.5l1.5 2 1.5-2H9v7H7.5V7.5L6 9.5 4.5 7.5v4H3zm8.5 0L9 8h1.5V4.5h2V8H14l-2.5 3.5z"/></svg>`,
      gear: `<svg viewBox="0 0 16 16" fill="#007acc"><path d="M9.1 0.1C8.7-0.0 8.3-0.0 7.9 0.1L6.9 1.7C6.4 1.9 6.0 2.2 5.6 2.5L3.8 1.9C3.4 1.8 3.0 1.9 2.7 2.2L1.2 3.7C0.9 4.0 0.8 4.4 0.9 4.8L1.5 6.6C1.2 7.0 0.9 7.4 0.7 7.9L-0.9 8.9C-1.0 9.3-1.0 9.7-0.9 10.1L0.7 11.1C0.9 11.6 1.2 12.0 1.5 12.4L0.9 14.2C0.8 14.6 0.9 15.0 1.2 15.3L2.7 16.8C3.0 17.1 3.4 17.2 3.8 17.1L5.6 16.5C6.0 16.8 6.4 17.1 6.9 17.3L7.9 18.9C8.3 19.0 8.7 19.0 9.1 18.9L10.1 17.3C10.6 17.1 11.0 16.8 11.4 16.5L13.2 17.1C13.6 17.2 14.0 17.1 14.3 16.8L15.8 15.3C16.1 15.0 16.2 14.6 16.1 14.2L15.5 12.4C15.8 12.0 16.1 11.6 16.3 11.1L17.9 10.1C18.0 9.7 18.0 9.3 17.9 8.9L16.3 7.9C16.1 7.4 15.8 7.0 15.5 6.6L16.1 4.8C16.2 4.4 16.1 4.0 15.8 3.7L14.3 2.2C14.0 1.9 13.6 1.8 13.2 1.9L11.4 2.5C11.0 2.2 10.6 1.9 10.1 1.7L9.1 0.1Z" transform="scale(0.8) translate(1,1)"/><circle cx="8" cy="8" r="3" fill="#ffffff"/></svg>`,
      git: `<svg viewBox="0 0 16 16" fill="#f34f29"><path d="M15.6 7.5L8.5 0.4A1 1 0 0 0 7.1 0.4L5.6 1.9l2.2 2.2a1.5 1.5 0 0 1 1.9 1.9l2.1 2.1a1.5 1.5 0 1 1-1.1 1.1l-2-2a1.5 1.5 0 0 1-1.7-0.4l-2.2 2.2a1.5 1.5 0 1 1-1.1-1.1l2.3-2.3a1.5 1.5 0 0 1 0.4-1.7L4.2 2.5.4 6.3a1 1 0 0 0 0 1.4l7.1 7.1a1 1 0 0 0 1.4 0l6.7-6.7a1 1 0 0 0 0-1.4z"/></svg>`,
      info: `<svg viewBox="0 0 16 16" fill="#005fb8"><circle cx="8" cy="8" r="7" stroke="#005fb8" stroke-width="1.5" fill="none"/><path d="M8 7v5M8 4.5v1" stroke="#005fb8" stroke-width="2" stroke-linecap="round"/></svg>`,
      text: `<svg viewBox="0 0 16 16" fill="#005fb8"><path d="M4 1.5A1.5 1.5 0 0 0 2.5 3v10A1.5 1.5 0 0 0 4 14.5h8a1.5 1.5 0 0 0 1.5-1.5V5.5L9.5 1.5H4zm5 1l3 3H9v-3zM4 3h4v3.5A.5.5 0 0 0 8.5 7H12v6H4V3z"/></svg>`,
      chevron: `<svg viewBox="0 0 16 16"><path d="M6 4l4 4-4 4"/></svg>`
    };

    const ITEMS = [
      {
        name: ".agents",
        type: "folder",
        expanded: false,
        children: [
          {
            name: "skills",
            type: "folder",
            expanded: false,
            children: [
              { name: "airtable-get-records", type: "folder" },
              { name: "alli-4u-create-skill", type: "folder" },
              { name: "alli-list-clients", type: "folder" },
              { name: "amazonads-list-accounts", type: "folder" },
              { name: "facebook-list-ad-accounts", type: "folder" },
              { name: "google-read-docs", type: "folder" },
              { name: "pmg-cowork-login", type: "folder" },
              { name: "pmg-which-customer", type: "folder" }
            ]
          }
        ]
      },
      {
        name: ".vscode",
        type: "folder",
        expanded: false,
        children: [
          { name: "settings.json", type: "file", icon: "gear" }
        ]
      },
      {
        name: "engagement",
        type: "folder",
        expanded: false,
        children: [
          { name: "culture_events", type: "folder" },
          { name: "pulse_surveys", type: "folder" },
          { name: "recognition_programs", type: "folder" }
        ]
      },
      {
        name: "onboarding",
        type: "folder",
        expanded: false,
        children: [
          { name: "new_hire_checklists", type: "folder" },
          { name: "role_30_60_90_plans", type: "folder" }
        ]
      },
      {
        name: "policies",
        type: "folder",
        expanded: false,
        children: [
          { name: "employee_handbook", type: "folder" },
          { name: "leave_catch_up_rules", type: "folder" },
          { name: "remote_work_guidelines", type: "folder" }
        ]
      },
      {
        name: "training",
        type: "folder",
        expanded: false,
        children: [
          { name: "learning_paths", type: "folder" },
          { name: "skill_matrices", type: "folder" }
        ]
      },
      { name: ".current_customer", type: "file", icon: "text" },
      { name: ".env", type: "file", icon: "gear", tooltip: "~/My Alli4U Folder/.env" },
      { name: ".gitignore", type: "file", icon: "git", tooltip: "~/My Alli4U Folder/.gitignore" },
      { name: "AGENTS.md", type: "file", icon: "markdown" },
      { name: "dist.env", type: "file", icon: "gear" },
      { name: "GEMINI.md", type: "file", icon: "markdown" },
      { name: "README.md", type: "file", icon: "info" }
    ];

    let selectedItemName = ".gitignore";

    function renderTree() {
      const container = document.getElementById("treeContainer");
      container.innerHTML = "";
      ITEMS.forEach(item => {
        container.appendChild(createTreeElement(item, 0));
      });
    }

    function createTreeElement(item, depth) {
      const wrapper = document.createElement("div");

      const row = document.createElement("div");
      const isSelected = item.name === selectedItemName;
      row.className = "tree-item" + (isSelected ? " selected" : "");
      row.style.paddingLeft = `${depth * 14 + 12}px`;

      if (item.tooltip) {
        row.onmouseenter = (e) => showTooltip(e, item.tooltip);
        row.onmouseleave = () => hideTooltip();
      }

      const chevron = document.createElement("span");
      chevron.className = "chevron" + (item.expanded ? " expanded" : "");
      if (item.type === "folder" && item.children && item.children.length > 0) {
        chevron.innerHTML = ICONS.chevron;
      }
      row.appendChild(chevron);

      const iconSpan = document.createElement("span");
      iconSpan.className = "item-icon";
      if (item.type === "folder") {
        iconSpan.innerHTML = item.expanded ? ICONS.folderOpen : ICONS.folder;
      } else {
        iconSpan.innerHTML = ICONS[item.icon] || ICONS.text;
      }
      row.appendChild(iconSpan);

      const labelSpan = document.createElement("span");
      labelSpan.className = "item-label";
      labelSpan.textContent = item.name;
      row.appendChild(labelSpan);

      row.onclick = (e) => {
        e.stopPropagation();
        if (item.type === "folder") {
          item.expanded = !item.expanded;
        }
        selectedItemName = item.name;
        renderTree();
      };

      wrapper.appendChild(row);

      if (item.type === "folder" && item.expanded && item.children) {
        item.children.forEach(child => {
          wrapper.appendChild(createTreeElement(child, depth + 1));
        });
      }

      return wrapper;
    }

    function showTooltip(e, text) {
      const tip = document.getElementById("tooltip");
      tip.textContent = text;
      tip.style.display = "block";
      tip.style.left = (e.clientX + 10) + "px";
      tip.style.top = (e.clientY + 10) + "px";
    }

    function hideTooltip() {
      document.getElementById("tooltip").style.display = "none";
    }

    renderTree();
  </script>
</body>
</html>
